name: Deploy Local Allure Report via API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Prepare output directories so steps do not fail on missing folders
      - name: Prepare Report Directories
        run: |
          mkdir -p allure-results
          mkdir -p allure-history

      # Retrieve existing gh-pages branch to maintain report trend history
      - name: Get Allure History
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Generate Allure Report using v1.10 (fixes openjdk Docker deprecation)
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.10
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      # Prevent GitHub Pages Jekyll processing from ignoring underscore folders
      - name: Add .nojekyll file
        run: touch allure-history/.nojekyll

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-history