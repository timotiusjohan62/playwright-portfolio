name: Deploy Local Allure Report via API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Download the uploaded zip artifact
      - name: Download Local Results Artifact
        uses: actions/download-artifact@v4
        with:
          name: local-allure-results
          path: allure-results-temp

      - name: Unpack Allure Results
        run: |
          mkdir -p allure-results
          unzip -o allure-results-temp/*.zip -d allure-results
          rm -rf allure-results-temp

      - name: Get Allure History
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.10
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-history