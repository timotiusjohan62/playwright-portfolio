name: Deploy Local Allure Report via API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Java & Allure CLI directly (Avoids Docker build failures)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Ensure output directories exist so steps do not throw ENOENT
      - name: Prepare Report Directories
        run: |
          mkdir -p allure-results
          mkdir -p allure-history

      # Checkout existing gh-pages branch to maintain report trend history
      - name: Get Allure History
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Generate Allure Report
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.9
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      # Create .nojekyll to prevent GitHub Pages from blocking underscore folders
      - name: Add .nojekyll file
        run: touch allure-history/.nojekyll

      # Deploy to GitHub Pages (creates gh-pages branch automatically on first run)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-history